<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DNS Intelligence Dashboard{% endblock %}</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Matrix Rain Background -->
    <canvas id="matrixCanvas"></canvas>
    
    <!-- Cyber Grid -->
    <div class="cyber-grid"></div>
    
    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <header class="cyber-header">
            <div class="logo-container">
                <div class="logo-icon">
                    <i class="fas fa-satellite-dish"></i>
                    <span class="pulse-ring"></span>
                </div>
                <div class="logo-text">
                    <span class="logo-main">DNS Intelligence</span>
                    <span class="logo-sub">CYBER SECURITY DASHBOARD</span>
                </div>
            </div>
            
            <div class="header-controls">
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-text">SYSTEM ONLINE</span>
                </div>
                <button id="themeToggle" class="cyber-btn" title="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="fullscreenToggle" class="cyber-btn" title="Fullscreen">
                    <i class="fas fa-expand"></i>
                </button>
            </div>
        </header>
        
        <!-- Main Content -->
        <main>
            {% block content %}{% endblock %}
        </main>
        
        <!-- Footer -->
        <footer class="cyber-footer">
            <div class="footer-content">
                <div class="footer-left">
                    <i class="fas fa-shield-halved"></i>
                    <span>SECURE CONNECTION</span>
                </div>
                <div class="footer-center">
                    <div class="typing-text">
                        <span id="typingEffect"></span>
                    </div>
                </div>
                <div class="footer-right">
                    <span id="clockDisplay"></span>
                    <span class="separator">|</span>
                    <span>v2.0.0</span>
                </div>
            </div>
        </footer>
    </div>
    
    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
